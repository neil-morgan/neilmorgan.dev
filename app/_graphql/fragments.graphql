fragment ExternalLink on ExternalLink {
  label
  url
  icon
}

fragment PageMeta on Page {
  metaTitle
  slug
}

fragment BlogPost on Page {
  sys {
    id
    publishedAt
  }
  description
  image {
    focalPoint
    image {
      url
      description
      width
      height
    }
  }
  slug
  title
  category {
    title
    slug
  }
}
