fragment Page on Page {
  __typename
  sys {
    id
    publishedAt
  }
  title
  kicker
  description
  slug
  image {
    focalPoint
    image {
      url
      description
      width
      height
    }
  }
}

fragment Section on Section {
  fullWidth
  gap
  layout
  margin
  minimumColumns
  title
  link {
    slug
  }
  linkLabel
  contentCollection(limit: 100) {
    items {
      ... on Feedback {
        ...Feedback
      }
      ... on Page {
        ...Page
      }
      ... on Skill {
        __typename
        sys {
          id
        }
        title
        proficiency
        icon {
          url
          description
        }
      }
      ... on Experience {
        __typename
        sys {
          id
        }
        title
        kicker
        description
        image {
          url
          description
        }
        agency {
          logo {
            title
            url
          }
          name
          url
        }
        skills: skillsCollection(limit: 20) {
          items {
            title
          }
        }
        date
      }
    }
  }
}

query SectionContent($preview: Boolean = false, $id: String!) {
  section: sectionCollection(
    limit: 1
    where: { sys: { id: $id } }
    preview: $preview
  ) {
    items {
      ...Section
    }
  }
}
