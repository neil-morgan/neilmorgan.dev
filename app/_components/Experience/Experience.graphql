query ExperienceContent($preview: Boolean, $limit: Int = 20) {
  experiences: pageCollection(
    preview: $preview
    order: date_DESC
    where: { category: "Experience" }
    limit: $limit
  ) {
    items {
      title
      kicker
      description
      images: imagesCollection {
        items {
          title
          url
          description
        }
      }
      date
      slug
    }
  }
}
