fragment Experience on Experience {
  title
  kicker
  description
  image {
    url
    description
  }
  agency {
    logo {
      title
      url
    }
    name
    url
  }
  skills: skillsCollection {
    items {
      title
    }
  }
  date
}

query ExperienceContent($preview: Boolean, $limit: Int = 20) {
  experiences: experienceCollection(
    preview: $preview
    order: date_DESC
    limit: $limit
  ) {
    items {
      ...Experience
    }
  }
}
