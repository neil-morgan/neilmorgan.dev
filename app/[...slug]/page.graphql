query AllPageSlugs($preview: Boolean = false) {
  pageCollection(limit: 100, preview: $preview) {
    items {
      slug
      type
    }
  }
}

fragment PageContentLinks on PageContentLinks {
  entries {
    block {
      sys {
        id
      }
      ... on Section {
        __typename
        sys {
          id
        }
      }
      ... on Page {
        __typename
        sys {
          id
        }
      }
    }
    inline {
      sys {
        id
      }
      ... on Section {
        __typename
        sys {
          id
        }
      }
      ... on Page {
        __typename
        sys {
          id
        }
      }
    }
  }
  assets {
    block {
      sys {
        id
      }
      url
      description
    }
  }
}

query PageContentBySlug(
  $slug: String
  $type_exists: Boolean
  $preview: Boolean = false
) {
  pageCollection(
    preview: $preview
    where: { slug: $slug, type_exists: $type_exists }
    limit: 1
  ) {
    items {
      __typename
      sys {
        id
      }
      ...PageHeader
      slug
      type
      metaTitle
      content {
        json
        links {
          ...PageContentLinks
        }
      }
    }
  }
}
